name: Sync to HackMD

# Triggered when content/ changes on main, or manually. The script itself
# changing also re-syncs in case conversion logic was updated. The mapping
# file is intentionally NOT in the trigger paths — the auto-commit step at
# the end would otherwise loop.
on:
  push:
    branches: [main]
    paths:
      - "content/**/*.md"
      - "scripts/sync-hackmd.mjs"
      - ".github/workflows/sync-hackmd.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hackmd-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run sync
        env:
          HACKMD_API_TOKEN: ${{ secrets.HACKMD_API_TOKEN }}
        run: node scripts/sync-hackmd.mjs

      - name: Commit mapping if changed
        run: |
          if ! git diff --quiet .hackmd-sync/mapping.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .hackmd-sync/mapping.json
            git commit -m "chore: update HackMD sync mapping [skip ci]"
            git push
          fi
